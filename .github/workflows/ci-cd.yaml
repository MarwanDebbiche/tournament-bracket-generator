name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only repo access; AWS auth comes from repository secrets.
permissions:
  contents: read

# Never let two deploys run against S3/CloudFront at the same time.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-west-3
      S3_BUCKET: tournament-bracket-generator-584240494786
      CLOUDFRONT_DISTRIBUTION_ID: E1RT36WNU333R
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy to S3
        run: |
          # Hashed assets: cache hard (their names change on every build).
          aws s3 sync dist/ "s3://$S3_BUCKET/" --delete --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          # Entry point: never cache, so new deploys are picked up immediately.
          aws s3 cp dist/index.html "s3://$S3_BUCKET/index.html" \
            --cache-control "no-cache" --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
